name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -v

  build:
    name: Docker Build and Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t slotsync .

      - name: Start container
        run: docker run -d --name slotsync -p 5000:5000 slotsync

      - name: Wait for health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy"
          docker logs slotsync
          exit 1

      - name: Check commit id is served
        run: curl -fsS http://localhost:5000/health | grep -q "$(echo ${{ github.sha }} | cut -c1-7)"

      - name: Stop container
        if: always()
        run: docker rm -f slotsync

  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"
